<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumIT</title>
<link rel="stylesheet" href="css/style.css">
<script>
// Pre-paint theme bootstrap -- must run before any CSS renders to avoid a flash of the
// wrong theme. Mirrors js/06_app.js's setTheme(), but that file loads (and awaits
// window.__sbReady) far too late in the page lifecycle for this to live there instead.
(function(){
  var stored = null;
  try{ stored = JSON.parse(localStorage.getItem('rf:ui:theme')); }catch(e){}
  var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@8.2.4/build/index.umd.js"></script>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="mark"></div>ResumIT</div>
  <div id="topbarAuthedControls" style="display:none;flex:1;align-items:center;justify-content:space-between;gap:16px;">
    <div class="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="library">Library</button>
      <button data-view="coverLetter">Cover Letter</button>
      <button data-view="editor" id="navResumeEditor" class="nav-resume-btn" style="display:none;"></button>
    </div>
    <div class="gh-status">
      <span id="saveStatusText" class="save-status-text ok" title="Library and version edits autosave to your account a moment after you stop typing.">All changes saved</span>
      <button class="theme-toggle" id="btnThemeToggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme"></button>
      <button class="btn btn-ghost btn-sm" id="btnExportJson">Export JSON</button>
      <button class="btn btn-ghost btn-sm" id="btnImportJson">Import JSON</button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none;">
      <div class="settings-menu-wrap">
        <button class="theme-toggle settings-gear" id="btnSettingsMenu" title="Settings" aria-label="Settings"></button>
        <div id="settingsDropdown" class="settings-dropdown" style="display:none;">
          <button class="settings-dropdown-item" data-view="preferences">Preferences</button>
          <div class="settings-divider"></div>
          <div class="settings-gh-status">
            <span class="dot" id="ghDot"></span>
            <span id="ghStatusText">GitHub not connected</span>
          </div>
          <button class="btn btn-ghost btn-sm" id="btnGhOpen" style="width:100%;margin-top:8px;">Connect</button>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="btnSignOut">Sign out</button>
    </div>
  </div>
  <button class="theme-toggle" id="btnMobileMenu" title="Menu" aria-label="Menu" style="display:none;"></button>
</div>

<div id="ghPanelWrap"></div>
<div id="entryEditModalWrap"></div>

<div class="view active" id="viewAuth"></div>

<div id="conflictBannerWrap"></div>

<div class="view" id="viewDashboard">
  <div class="stats" id="statsRow"></div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search versions, companies, roles" style="max-width:300px;">
    <select id="sortSelect">
      <option value="recent">Sort: recent</option>
      <option value="company">Sort: company</option>
      <option value="applied">Sort: date applied</option>
    </select>
  </div>
  <div class="cards" id="versionCards"></div>
</div>

<div class="view" id="viewLibrary">
  <div class="lib-tabs" id="libTabs">
    <button data-kind="experience" class="active">Experience</button>
    <button data-kind="projects">Projects</button>
    <button data-kind="education">Education</button>
    <button data-kind="skills">Skills</button>
    <button data-kind="summaries">Summaries</button>
    <button data-kind="references">References</button>
    <button data-kind="customSections">Custom Sections</button>
    <button data-kind="meta">Header</button>
  </div>
  <div id="libPanels"></div>
</div>

<div class="view" id="viewPreferences"></div>

<div class="view" id="viewCoverLetter"></div>

<div class="view" id="viewEditor">
  <div class="editor-layout">
    <div class="ed-panel" id="edPanel"></div>
    <div class="stage">
      <div class="stage-controls">
        <div><button class="btn btn-ghost btn-sm" id="btnBackDash">&larr; Dashboard</button></div>
        <div class="page-badge" id="pageBadge"></div>
        <div class="zoom-controls">
          <button id="btnZoomOut" title="Zoom out">&minus;</button>
          <button id="btnZoomFit" class="zoom-fit-btn active" title="Fit to width">Fit</button>
          <span class="zoom-label" id="zoomLabel">100%</span>
          <button id="btnZoomIn" title="Zoom in">+</button>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-brass" id="btnDownloadPdf">Download PDF</button>
          <button class="btn btn-ghost" id="btnDownloadDocx">Download DOCX</button>
        </div>
      </div>
      <div id="pagesWrap"></div>
    </div>
  </div>
</div>

<div class="measure-host" id="measureHost"></div>

<script src="js/00_supabase.js"></script>
<script src="js/01_core.js"></script>
<script src="js/02_paginate.js"></script>
<script src="js/03_model.js"></script>
<script src="js/03b_history.js"></script>
<!-- 01b_data.js loads here, after 03_model.js, not right after 01_core.js as its filename
     prefix might suggest -- DB.getLibrary() calls 03_model.js's emptyLibrary() to seed a
     brand-new account's first row. -->
<script src="js/01b_data.js"></script>
<script src="js/04_jdmatch.js"></script>
<script src="js/05_export_docx.js"></script>
<script src="js/06_app.js"></script>
</body>
</html>
